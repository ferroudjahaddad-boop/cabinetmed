<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cabinet Médical — Connexion</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">

  <div class="login-card">

    <div class="login-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="white" width="28" height="28">
          <path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 3a1 1 0 0 1 1 1v3h3a1 1 0 1 1 0 2h-3v3a1 1 0 1 1-2 0v-3H8a1 1 0 1 1 0-2h3V7a1 1 0 0 1 1-1z"/>
        </svg>
      </div>
      <h1>Cabinet Médical</h1>
      <p>Système de gestion</p>
    </div>

    <div class="login-tabs">
      <button class="tab active" onclick="switchTab('login', this)">Connexion</button>
      <button class="tab" onclick="switchTab('register', this)">Inscription</button>
    </div>

    <!-- CONNEXION -->
    <div id="form-login">
      <div class="form-group">
        <label>Email <span>*</span></label>
        <input type="email" id="login-email" placeholder="votre@email.com">
        <small class="error" id="err-email">Email invalide.</small>
      </div>

      <div class="form-group">
        <label>Mot de passe <span>*</span></label>
        <div class="input-pass">
          <input type="password" id="login-pass" placeholder="••••••••">
          <button type="button" onclick="togglePass('login-pass')">
            <svg id="eye-login" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <small class="error" id="err-pass">Mot de passe requis.</small>
      </div>

      <div class="login-extra">
        <label class="checkbox-label">
          <input type="checkbox"> Se souvenir de moi
        </label>
        <a href="#">Mot de passe oublié ?</a>
      </div>

      <button class="btn-submit" onclick="handleLogin()">
        <span id="btn-text">Se connecter</span>
        <div class="spinner" id="spinner"></div>
      </button>
    </div>

    <!-- INSCRIPTION -->
    <!-- INSCRIPTION -->
<div id="form-register" style="display:none">

  <div class="register-info">
    <i class="fa-solid fa-circle-info"></i>
    Créez votre compte pour prendre des rendez-vous.
  </div>

  <div class="form-group">
    <label>Nom complet <span>*</span></label>
    <input type="text" id="reg-name" placeholder="Prénom Nom"
      onkeydown="inputNomOnly(event)" maxlength="100">
  </div>

  <div class="form-group">
    <label>Email <span>*</span></label>
    <input type="email" id="reg-email" placeholder="votre@email.com">
  </div>

  <div class="form-group">
    <label>Téléphone <span>*</span></label>
    <input type="tel" id="reg-phone" placeholder="0600000000"
      onkeydown="inputTelOnly(event)" maxlength="10">
  </div>

  <div class="form-group">
    <label>Mot de passe <span>*</span></label>
    <div class="input-pass">
      <input type="password" id="reg-pass" placeholder="Minimum 8 caractères">
      <button type="button" onclick="togglePass('reg-pass')">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
  </div>

  <button class="btn-submit" onclick="handleRegister()">Créer mon compte</button>

</div>

  </div>

  <div class="toast" id="toast"></div>

  <script src="js/main.js"></script>
  <script>
    function switchTab(tab, el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
    }

    function togglePass(id) {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });
  </script>
</body>
</html>
